<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimas Card Templates</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f2ea;
      color: #171717;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .card { width: 252px; }
    .card h2 { margin: 0 0 8px; font-size: 14px; }
    .meta { margin: 8px 0 0; font-size: 12px; line-height: 1.45; color: #555; }
    .meta b { color: #171717; font-weight: 700; }
    .frame {
      width: 252px;
      height: 352px;
      background: white;
      box-shadow: 0 2px 12px rgb(0 0 0 / .16);
    }
    .frame svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1>Mimas Card Templates</h1>
  <main class="grid" id="grid"></main>
  <script type="module">
    const config = await fetch("../design/templates.json").then((response) => response.json());
    const samples = [
      ["only-numbers", { number: "7", color: "#171717", symbol: "" }],
      ["numbers&colors red", { number: "1", color: config.colors.red, symbol: config.symbols.circle }],
      ["numbers&colors blue", { number: "2", color: config.colors.blue, symbol: config.symbols.diamond }],
      ["numbers&colors yellow", { number: "3", color: config.colors.yellow, symbol: config.symbols.triangle }],
      ["numbers&colors green", { number: "4", color: config.colors.green, symbol: config.symbols.square }],
      ["numbers&colors purple", { number: "5", color: config.colors.purple, symbol: config.symbols.star }],
    ];

    const fill = (text, data) => text.replace(/\{\{(\w+)\}\}/g, (_, key) => data[key] ?? "");
    const templateId = (name) => name.startsWith("numbers&colors") ? "numbers&colors" : name;
    const fontInfo = (id) => Object.entries(config.templates[id]?.font || {})
      .map(([role, family]) => `<div><b>${role}</b>: ${family}</div>`)
      .join("");
    const grid = document.querySelector("#grid");

    for (const [name, data] of samples) {
      const id = templateId(name);
      const svg = await fetch(`../design/${config.templates[id].file}`).then((response) => response.text());
      const section = document.createElement("section");
      section.className = "card";
      section.innerHTML = `<h2>${name}</h2><div class="frame">${fill(svg, data)}</div><div class="meta">${fontInfo(id)}</div>`;
      grid.append(section);
    }
  </script>
</body>
</html>
